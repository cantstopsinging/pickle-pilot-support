<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pickle Pilot</title>
  <style>
    :root { --green:#35a853; --dark:#163b2a; --muted:#667085; --bg:#f7faf8; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; background:var(--bg); color:#1f2937; }
    main { max-width:760px; margin:0 auto; padding:56px 24px; }
    .card { background:#fff; border-radius:20px; padding:36px; box-shadow:0 8px 30px rgba(0,0,0,.06); }
    h1 { margin:0 0 10px; color:var(--dark); font-size:40px; }
    p { line-height:1.6; }
    .links { display:flex; gap:12px; flex-wrap:wrap; margin-top:28px; }
    a.button { display:inline-block; text-decoration:none; color:#fff; background:var(--green); padding:12px 18px; border-radius:12px; font-weight:600; }
    a.secondary { background:#e8f5ec; color:var(--dark); }
    .muted { color:var(--muted); font-size:14px; margin-top:28px; }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <h1>Pickle Pilot</h1>
      <p>Simple tools for organizing pickleball tournaments, rotating partners, tracking scores, and viewing standings.</p>
      <div class="links">
        <a class="button" href="./support.html">Support</a>
        <a class="button secondary" href="./privacy.html">Privacy Policy</a>
      </div>
      <p class="muted">© 2026 Pickle Pilot</p>
    </div>
  </main>
</body>
</html>
